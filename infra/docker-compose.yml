name: devsquad
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devsquad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsquad}
      POSTGRES_DB: devsquad
    ports: ["127.0.0.1:${DEVSQUAD_POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsquad"]
      interval: 5s
      timeout: 3s
      retries: 10

  devsquad:
    build: { context: .., dockerfile: Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      DEVSQUAD_DB_URL: postgres://devsquad:${POSTGRES_PASSWORD:-devsquad}@postgres:5432/devsquad
      DEVSQUAD_HTTP_ADDR: :8080
      DEVSQUAD_WORKSPACE_ROOT: /workspace
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - workspace:/workspace
      - ../examples/devsquad-templates:/projects/templates:ro
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [full]

  web:
    build:
      context: ../web
      args:
        CONTROL_PLANE_URL: http://devsquad:8080
    environment:
      CONTROL_PLANE_URL: http://devsquad:8080
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [devsquad]
    profiles: [full]

volumes:
  pgdata:
  workspace:
