services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devsquad
      POSTGRES_PASSWORD: devsquad
      POSTGRES_DB: devsquad
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsquad"]
      interval: 2s
      timeout: 2s
      retries: 30
